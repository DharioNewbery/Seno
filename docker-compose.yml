services:
  postgres:
    image: postgres:17-alpine
    container_name: seno-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: seno
      POSTGRES_PASSWORD: seno
      POSTGRES_DB: seno
    ports:
      - "5432:5432"
    volumes:
      - seno_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seno"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  seno_pgdata:
