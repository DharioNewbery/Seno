# compose.http.yaml — override para operação HTTP pura no Caddy
# (ex.: atrás de um proxy reverso externo que já faz terminação TLS).

services:
  caddy:
    ports: !override
      - "${SENO_HTTP_PORT:-80}:80"
    volumes: !override
      - ./caddy/Caddyfile.http:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
