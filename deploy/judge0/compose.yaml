# Judge0 CE — execução de código do Monitor (e da API).
# Compose baseado no oficial (github.com/judge0/judge0).
#
# IMAGEM: uso a fork da comunidade `mrkushalsm/judge0:cgv2` (judge0 #549)
# porque o oficial `judge0/judge0:1.13.*` usa isolate 1.8.1 que exige
# cgroups v1 — Docker Desktop/WSL2 (Windows) roda cgroups v2 e não permite
# rebaixamento. A imagem cgv2 suporta v1 e v2 (com /sys/fs/cgroup rw).
# shortcut: imagem terceira em produção — reavaliar no host Linux real da
# UFPA (cgroups v1 oficial ou fork auditado), ver PLANO_MONITOR Fase 8.
name: seno-judge0

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100m

services:
  server:
    image: seno-judge0:cgv2
    build: .
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    expose:
      - "2358"
    privileged: true # isolate precisa (sandbox interno)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2358/system_info >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    <<: *default-logging
    restart: always

  workers:
    image: seno-judge0:cgv2
    build: .
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *default-logging
    restart: always

  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-judge0} -d $${POSTGRES_DB:-judge0}"]
      interval: 10s
      timeout: 5s
      retries: 10
    <<: *default-logging
    restart: always

  redis:
    image: redis:6.2
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    <<: *default-logging
    restart: always

volumes:
  postgres-data:
  redis-data:

