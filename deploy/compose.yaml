# compose.yaml — produção do Seno (Fase 8 do PLANO_MONITOR_FLUXO_ALUNO).
# Hoje cobre o que existe e está testado: Monitor (realização da prova) +
# Judge0 + PostgreSQL do Monitor + sidecar de backup diário (ARQUITETURA §9.1).
# api/web/caddy entram aqui na Fase 9 (integração com a API); o postgres deste
# arquivo continuará sendo o servidor único com bancos separados (seno e
# seno_monitor — decisão do PLANO_MONITOR).
#
# Antes: cp .env.example .env (e troque TODOS os segredos).
# Subir: docker compose -f deploy/compose.yaml --env-file deploy/.env up -d
#
# Imagem: em produção prefira GHCR (release.yml) em vez de build no host —
# neste momento não há release do Monitor, então o build local com contexto
# na raiz do monorepo (contract/ compartilhado) é o caminho.

name: seno

include:
  - ./judge0/compose.yaml # Judge0 (server, workers, db, redis) no mesmo projeto

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seno # banco da API (fase 9); o Monitor usa seno_monitor
      POSTGRES_USER: ${POSTGRES_USER:-seno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seno}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seno}"]
      interval: 10s
      timeout: 5s
      retries: 10

  monitor:
    build:
      context: ..
      dockerfile: monitor/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides de rede interna (valores de localhost do .env não valem aqui):
      SENO_MONITOR_DSN: postgres://${POSTGRES_USER:-seno}:${POSTGRES_PASSWORD:-seno}@postgres:5432/seno_monitor?sslmode=disable
      SENO_JUDGE0_URL: http://server:2358
      SENO_MONITOR_CALLBACK_URL: http://monitor:8081
      SENO_COOKIE_SECURE: "true" # HTTPS do Caddy (§8.4)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/seno-monitor", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Backup diário dos bancos (§9.1: pg_dump por database; o WAL por
  # archive_command entra na fase 9 junto do postgres da API). Retenção 120 d.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-seno}
    entrypoint: >-
      sh -c 'while :; do
        ts=$$(date +%Y%m%d);
        pg_dump "-hpostgres" "-U$${POSTGRES_USER:-seno}" -d seno_monitor -Fc
          -f /backups/seno_monitor-$${ts}.dump;
        find /backups -name "seno_monitor-*.dump" -mtime +120 -delete;
        sleep 86400;
      done'
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: # dados do postgres (bancos seno e seno_monitor)
  backups:
