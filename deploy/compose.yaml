# compose.yaml — produção do Seno (ARQUITETURA §8.3).
# Cobre toda a stack de produção: Caddy (único ponto de entrada) + Web (BFF SvelteKit) +
# API (Go) + Monitor (realização da prova) + Judge0 + PostgreSQL + sidecar de backup diário.
#
# Deploy rápido em Linux:
#   ./deploy/deploy.sh

name: seno

include:
  - ./judge0/compose.yaml # Judge0 (server, workers, db, redis) no mesmo projeto

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seno} # banco principal da API; o Monitor usa seno_monitor
      POSTGRES_USER: ${POSTGRES_USER:-seno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seno}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seno} -d ${POSTGRES_DB:-seno}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      SENO_DATABASE_URL: postgres://${POSTGRES_USER:-seno}:${POSTGRES_PASSWORD:-seno}@postgres:5432/${POSTGRES_DB:-seno}?sslmode=disable
      SENO_WEB_ORIGIN: ${SENO_WEB_ORIGIN}
      SENO_JUDGE0_URL: http://server:2358
      SENO_JUDGE0_CALLBACK_URL: http://api:8080
      SENO_MONITOR_URL: http://monitor:8081
      SENO_MONITOR_PUBLIC_URL: ${SENO_MONITOR_PUBLIC_URL:-/monitor}
    depends_on:
      postgres:
        condition: service_healthy

  monitor:
    build:
      context: ..
      dockerfile: monitor/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides de rede interna:
      SENO_MONITOR_DSN: postgres://${POSTGRES_USER:-seno}:${POSTGRES_PASSWORD:-seno}@postgres:5432/seno_monitor?sslmode=disable
      SENO_API_URL: http://api:8080
      SENO_JUDGE0_URL: http://server:2358
      SENO_MONITOR_CALLBACK_URL: http://monitor:8081
      SENO_COOKIE_SECURE: ${SENO_COOKIE_SECURE:-true}
      SENO_WEB_URL: ${SENO_WEB_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/seno-monitor", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      SENO_API_URL: http://api:8080
      SENO_WEB_ORIGIN: ${SENO_WEB_ORIGIN}
      SENO_COOKIE_SECURE: ${SENO_COOKIE_SECURE:-true}
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      BODY_SIZE_LIMIT: ${SENO_WEB_BODY_LIMIT:-16M}
      PORT: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - api

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "${SENO_HTTP_PORT:-80}:80"
      - "${SENO_HTTPS_PORT:-443}:443"
    environment:
      SENO_HTTPS_PORT_SUFFIX: ${SENO_HTTPS_PORT_SUFFIX:-}
      SENO_TRUSTED_PROXIES: ${SENO_TRUSTED_PROXIES:-private_ranges}
    volumes:
      - ${SENO_CADDYFILE:-./caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - monitor

  # Backup diário dos bancos (§9.1: pg_dump por database). Retenção 120 d.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-seno}
    entrypoint: >-
      sh -c 'while :; do
        ts=$$(date +%Y%m%d);
        pg_dump "-hpostgres" "-U$${POSTGRES_USER:-seno}" -d seno_monitor -Fc -f /backups/seno_monitor-$${ts}.dump;
        pg_dump "-hpostgres" "-U$${POSTGRES_USER:-seno}" -d "$${POSTGRES_DB:-seno}" -Fc -f /backups/seno-$${ts}.dump;
        find /backups -name "seno_monitor-*.dump" -mtime +120 -delete;
        find /backups -name "seno-*.dump" -mtime +120 -delete;
        sleep 86400;
      done'
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      monitor:
        condition: service_healthy

volumes:
  pgdata: # dados do postgres (bancos seno e seno_monitor)
  backups:
  caddy_data:
  caddy_config:
