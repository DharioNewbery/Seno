name: Release

# Publica as imagens docker no GHCR quando uma tag v* é criada
# (Arquitetura §8.2). O servidor da UFPA só faz `docker compose pull`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publicar imagens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados (tag da imagem)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/seno-api
            ghcr.io/${{ github.repository_owner }}/seno-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build e push — api
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/seno-api:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/seno-api:latest

      - name: Build e push — web
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/seno-web:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/seno-web:latest
