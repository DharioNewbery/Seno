<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seno — Realização de Atividade</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header id="bar">
    <div class="bar-esquerda">
      <span class="logo-seno" aria-hidden="true">SENO</span>
      <strong id="titulo" class="titulo-atividade">Seno — realização</strong>
      <nav id="tarefas-nav" class="tarefas-nav" aria-label="Navegação de tarefas"></nav>
    </div>
    <div class="bar-direita">
      <span id="crono" class="crono" hidden></span>
      <div id="salvo-badge" class="salvo-badge" title="Status de salvamento">
        <span id="salvo-icone" class="salvo-icone" aria-hidden="true">
          <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
        </span>
        <span id="salvo">conectando…</span>
      </div>
    </div>
  </header>

  <main id="conteudo" class="conteudo-principal">
    <div class="estado-carregando">
      <div class="spinner"></div>
      <p class="mudo">Carregando atividade…</p>
    </div>
  </main>

  <footer id="bar-rodape" class="bar-rodape" hidden>
    <div class="rodape-esquerda">
      <div id="progresso-texto" class="progresso-texto">0 de 0 tarefas preenchidas</div>
      <div class="progresso-trilho">
        <div id="progresso-barra" class="progresso-barra" style="width: 0%"></div>
      </div>
    </div>
    <div class="rodape-direita">
      <button id="btn-rodape-testar" type="button" class="btn btn-secundario" title="Atalho: Ctrl+Enter">
        <svg class="icone" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>
        <span>Testar Código</span>
        <kbd class="atalho-teclado">Ctrl+Enter</kbd>
      </button>
      <button id="btn-rodape-avaliar" type="button" class="btn btn-primario">
        Entregar
      </button>
    </div>
  </footer>

  <dialog id="modal"></dialog>
  <script src="editor.js"></script>
  <script src="app.js"></script>
</body>
</html>
